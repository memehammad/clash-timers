name: Render widgets

on:
  workflow_dispatch:
  push:
    branches: [renders-run]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            chmod +x gradlew
            ./gradlew --no-daemon installDebug installDebugAndroidTest
            for seed in 4E8FA8 B5655A; do for mode in no yes; do adb shell settings put secure theme_customization_overlay_packages "'{\"android.theme.customization.system_palette\":\"$seed\",\"android.theme.customization.theme_style\":\"TONAL_SPOT\"}'"; adb shell cmd uimode night $mode; sleep 6; adb shell am instrument -w -e class dev.memehammad.clashtimers.RenderTest dev.memehammad.clashtimers.test/androidx.test.runner.AndroidJUnitRunner || true; mkdir -p "renders_${seed}_${mode}"; adb pull /sdcard/Android/data/dev.memehammad.clashtimers/files/renders "renders_${seed}_${mode}" || true; if [ "$seed" = 4E8FA8 ]; then adb shell pm grant dev.memehammad.clashtimers android.permission.POST_NOTIFICATIONS || true; adb shell settings put global sysui_demo_allowed 1; adb shell am broadcast -a com.android.systemui.demo -e command enter; adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 1200; adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false; adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false; adb shell am start -W -n dev.memehammad.clashtimers/.MainActivity; sleep 5; adb exec-out screencap -p > "renders_${seed}_${mode}/app_1.png"; adb shell input swipe 540 1800 540 700 600; sleep 2; adb exec-out screencap -p > "renders_${seed}_${mode}/app_2.png"; adb shell input swipe 540 1800 540 700 600; sleep 2; adb exec-out screencap -p > "renders_${seed}_${mode}/app_3.png"; adb shell am force-stop dev.memehammad.clashtimers; fi; done; done
      - name: Push renders to the "renders" branch
        run: |
          mkdir -p out && cp -r renders_* out/ 2>/dev/null || true
          cd out
          git init -q -b renders
          git config user.name "render bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Renders ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" renders
