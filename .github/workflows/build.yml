name: Build APK

on:
  push:
    branches: [main, smartspacer]
    paths-ignore:
      - '**.md'
      - 'tools/**'
      - 'docs/**'
      - 'fastlane/**'
      - '.github/workflows/renders.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional SIGNING_KEY secret, base64 of release.jks)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "$SIGNING_KEY" | base64 -d > app/release.jks; fi

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ClashTimers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimers
          path: ClashTimers.apk

      - name: Release notes (newest section of CHANGELOG.md)
        run: |
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Publish release (download the APK here from your phone)
        uses: softprops/action-gh-release@v2
        with:
          # Tag matches the app's versionName (1.0.<run>) so Obtainium can detect updates.
          # Builds from other branches are previews: pre-releases that Obtainium skips unless asked.
          tag_name: v1.0.${{ github.run_number }}${{ github.ref_name != 'main' && '-preview' || '' }}
          name: Clash Timers 1.0.${{ github.run_number }}${{ github.ref_name != 'main' && ' (preview)' || '' }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body_path: release_notes.md
          files: ClashTimers.apk

      - name: Store changelog for F-Droid / IzzyOnDroid (fastlane)
        if: github.ref_name == 'main'
        run: |
          f=fastlane/metadata/android/en-US/changelogs/${{ github.run_number }}.txt
          sed -e 's/\*\*//g' -e 's/\[\([^]]*\)\]([^)]*)/\1/g' release_notes.md | sed '/./,$!d' | head -c 500 > "$f"
          git config user.name "release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add "$f"
          git commit -qm "Fastlane changelog for ${{ github.run_number }} [skip ci]" || exit 0
          git push origin HEAD:main || true
