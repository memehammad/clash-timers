name: Build APK

# A release is only made when CHANGELOG.md changes (a new version section), or when started by
# hand. Other pushes to app code just build, so mistakes show up without a new release.
on:
  push:
    branches: [main, smartspacer, wear-preview, settings-preview]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from the newest changelog heading
        run: echo "VERSION_NAME=$(grep -m1 -oP '^## \K[0-9][0-9.]*' CHANGELOG.md)" >> "$GITHUB_ENV"

      - name: Release only for a changelog update
        id: gate
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          before="${{ github.event.before }}"
          # A new branch has no "before": compare with where it left main.
          git cat-file -e "$before" 2>/dev/null || before=$(git merge-base origin/main "${{ github.sha }}")
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qx CHANGELOG.md; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key (optional SIGNING_KEY secret, base64 of release.jks)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "$SIGNING_KEY" | base64 -d > app/release.jks; fi

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ClashTimers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClashTimers
          path: ClashTimers.apk

      - name: Release notes (newest section of CHANGELOG.md)
        run: |
          awk '/^## /{n++} n==1 && !/^## /' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Publish release (download the APK here from your phone)
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Tag matches the app's versionName (the changelog heading) so Obtainium can detect updates.
          # Builds from other branches are previews: pre-releases that Obtainium skips unless asked.
          tag_name: v${{ env.VERSION_NAME }}${{ github.ref_name != 'main' && '-preview' || '' }}
          name: Clash Timers ${{ env.VERSION_NAME }}${{ github.ref_name != 'main' && ' (preview)' || '' }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body_path: release_notes.md
          files: ClashTimers.apk

      - name: Store changelog for F-Droid / IzzyOnDroid (fastlane)
        if: github.ref_name == 'main' && steps.gate.outputs.release == 'true'
        run: |
          f=fastlane/metadata/android/en-US/changelogs/${{ github.run_number }}.txt
          sed -e 's/\*\*//g' -e 's/\[\([^]]*\)\]([^)]*)/\1/g' release_notes.md | sed '/./,$!d' | head -c 500 > "$f"
          git config user.name "release bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add "$f"
          git commit -qm "Fastlane changelog for ${{ github.run_number }} [skip ci]" || exit 0
          git push origin HEAD:main || true
