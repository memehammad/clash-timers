name: Render Wear OS

on:
  workflow_dispatch:
  push:
    branches: [wear-renders-run]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :wear:assembleDebug :wear:assembleDebugAndroidTest :app:assembleRelease
      - name: Render on a Wear OS emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: false
          script: |
            mkdir -p shots
            adb install -r wear/build/outputs/apk/debug/wear-debug.apk
            adb install -r wear/build/outputs/apk/androidTest/debug/wear-debug-androidTest.apk
            adb shell am instrument -w dev.memehammad.clashtimers.test/androidx.test.runner.AndroidJUnitRunner || true
            adb shell am start -W -n dev.memehammad.clashtimers/dev.memehammad.clashtimers.wear.WearActivity; sleep 6
            adb exec-out screencap -p > shots/app_1.png
            adb shell input swipe 225 380 225 120 400; sleep 2
            adb exec-out screencap -p > shots/app_2.png
            adb shell input swipe 225 380 225 120 400; sleep 2
            adb exec-out screencap -p > shots/app_3.png
            adb shell input keyevent KEYCODE_HOME; sleep 2
            adb shell am broadcast -a com.google.android.wearable.app.DEBUG_SURFACE --es operation add-tile --ecn component dev.memehammad.clashtimers/dev.memehammad.clashtimers.wear.BuildersTile || true
            sleep 3
            adb shell am broadcast -a com.google.android.wearable.app.DEBUG_SYSUI --es operation show-tile --ei index 0 || true
            sleep 5
            adb exec-out screencap -p > shots/tile.png
            adb logcat -d | grep -iE "clashtimers|AndroidRuntime" | tail -60 > shots/log.txt || true
      - name: Push screenshots to the "wear-renders" branch
        if: always()
        run: |
          mkdir -p out && cp -r shots out/ 2>/dev/null || true
          cd out
          git init -q -b wear-renders
          git config user.name "render bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Wear renders ${{ github.sha }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" wear-renders
